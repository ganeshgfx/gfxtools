[package]
name = "gfx-tools"
version = "1.0.0"
edition = "2021"
authors = ["GFX Tools"]
description = "Windows Explorer context-menu video downloader via yt-dlp"
repository = ""
license = "MIT"

[[bin]]
name = "gfx-tools"
path = "src/main.rs"

[lib]
name = "gfx_tools"
path = "src/lib.rs"

[dependencies]
# Windows API bindings
windows = { version = "0.58.0", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_System_Console", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse"] }

# URL parsing
url = "2"

# Clipboard
arboard = "3"

# Error handling
thiserror = "1"
anyhow = "1"

# Config / serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Regex for yt-dlp progress parsing
regex = "1"
eframe = { version = "0.28.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.28.1"
rfd = "0.17.2"

# Icon loading (PNG decode only — used for embedding app icon in eframe windows)
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# Compiles and links the Windows resource file (resources.rc) to embed the app icon.
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[dev-dependencies]
# No extra deps for tests
