name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss
          options: /O+

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/GFXTools_Installer.exe
          generate_release_notes: true

      # Manual Winget Publishing (No Token)
      # 1. Wait for this Action to finish building and releasing the .exe
      # 2. On your PC, run: winget install wingetcreate
      # 3. Run: wingetcreate new https://github.com/ganesh/gfxtools/releases/download/v1.0.0/GFXTools_Installer.exe
